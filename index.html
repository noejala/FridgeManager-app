<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Freego</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />

    <!-- PWA / iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Freego" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />

    <!-- Splash screen font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7f8;
        transition: opacity 0.35s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 3rem;
        font-weight: 600;
        font-style: italic;
        color: #1a1a1a;
        letter-spacing: 0.03em;
        line-height: 1;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-logo span {
        color: #2c6fe0;
      }
      .splash-dots {
        display: flex;
        gap: 0.45rem;
        margin-top: 1.75rem;
      }
      .splash-dots i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.18);
        animation: splash-dot 1.6s ease-in-out infinite;
        font-style: normal;
      }
      .splash-dots i:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.55; transform: scale(0.96); }
      }
      @keyframes splash-dot {
        0%, 70%, 100% { transform: scale(0.5); opacity: 0.25; }
        35%           { transform: scale(1); opacity: 0.7; }
      }
      #splash[data-dark="1"] { background: #0e1520; }
      #splash[data-dark="1"] .splash-logo { color: #e8e3d8; }
      #splash[data-dark="1"] .splash-dots i { background: rgba(255, 255, 255, 0.2); }
      @media (prefers-color-scheme: dark) {
        #splash:not([data-dark="0"]) { background: #0e1520; }
        #splash:not([data-dark="0"]) .splash-logo { color: #e8e3d8; }
        #splash:not([data-dark="0"]) .splash-dots i { background: rgba(255, 255, 255, 0.2); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">Free<span>go</span></div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        var dark = t === 'dark' ? '1' : t === 'light' ? '0' : null;
        if (dark !== null) document.getElementById('splash').setAttribute('data-dark', dark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
